name: CI

# Pushes to main (what the deployer checks) and pull requests. A push to a
# branch with an open PR would otherwise run the whole matrix twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The pinned lock, so CI tests exactly what Docker and update.sh install.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # uv keeps the existing pins when it recompiles, so this only fails when
      # pyproject.toml changed without the lock files being regenerated.
      - name: Check the lock files match pyproject.toml
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.10 \
            -q -o requirements.txt
          uv pip compile pyproject.toml --extra dev --universal \
            --python-version 3.10 -q -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t aemet-avisos-bot .

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the deploy script
        run: shellcheck deploy/update.sh

      # systemd-analyze rejects units whose User or ExecStart cannot be
      # resolved, so stand up just enough of the target layout for the check to
      # be about the units themselves.
      - name: Stage the paths the units reference
        run: |
          sudo useradd --system --shell /usr/sbin/nologin aemetbot
          sudo mkdir -p /opt/aemet-avisos-bot/deploy /opt/aemet-avisos-bot/.venv/bin
          sudo cp deploy/update.sh /opt/aemet-avisos-bot/deploy/update.sh
          sudo ln -s "$(command -v python3)" /opt/aemet-avisos-bot/.venv/bin/python

      - name: Verify the systemd units
        run: |
          systemd-analyze verify \
            deploy/aemet-avisos-bot.service \
            deploy/aemet-avisos-bot-update.service \
            deploy/aemet-avisos-bot-update.timer
